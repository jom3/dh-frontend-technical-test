<div class="min-h-96 bg-gray-50 p-8">
  <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-sm p-8">
    <form [formGroup]="noteForm" (ngSubmit)="onSubmit()">

      <input
        type="text"
        formControlName="title"
        (input)="handleChange()"
        placeholder="Enter a title..."
        class="w-full text-4xl font-bold border-none outline-none mb-6 placeholder-gray-400 focus:outline-none"
      />

      <div class="flex items-center gap-3 mb-4 pb-4 border-b border-gray-200">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z">
          </path>
        </svg>
        <label class="font-semibold text-gray-700">Tags</label>
        <input
          type="text"
          formControlName="tags"
          (input)="handleChange()"
          placeholder="Add tags separated by commas (e.g. Work, Planning)"
          class="flex-1 border-none outline-none text-gray-600 placeholder-gray-400 focus:outline-none"
        />
      </div>

      <div class="flex items-center gap-3 mb-6 pb-6 border-b border-gray-200">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <label class="font-semibold text-gray-700">Last edited</label>
        <span class="text-gray-400">{{ lastEdited }}</span>
      </div>

      <textarea
        formControlName="content"
        (input)="handleChange()"
        placeholder="Start typing your note here..."
        class="w-full min-h-[250px] border-none outline-none text-gray-700 placeholder-gray-400 resize-none focus:outline-none">
      </textarea>

      <div class="flex gap-4 mt-6">
        <button
          type="submit"
          class="px-8 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">
          Save Note
        </button>
        <button
          type="button"
          (click)="handleCancel()"
          class="px-8 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition-colors">
          Cancel
        </button>
      </div>

    </form>
  </div>
</div>
